name: duesoon

services:
  duesoon-db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - duesoon-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - duesoon-internal

  duesoon-migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    depends_on:
      duesoon-db:
        condition: service_healthy
    networks:
      - duesoon-internal

  duesoon-app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      TIMETABLE_ENCRYPTION_KEY: ${TIMETABLE_ENCRYPTION_KEY:?Set TIMETABLE_ENCRYPTION_KEY in .env}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
    ports:
      - "127.0.0.1:${DUESOON_PORT:-3000}:3000"
    depends_on:
      duesoon-db:
        condition: service_healthy
      duesoon-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - duesoon-internal

  duesoon-timetable-sync:
    build:
      context: .
      target: timetable-syncer
    profiles: ["tasks"]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      TIMETABLE_ENCRYPTION_KEY: ${TIMETABLE_ENCRYPTION_KEY:?Set TIMETABLE_ENCRYPTION_KEY in .env}
    depends_on:
      duesoon-db:
        condition: service_healthy
      duesoon-migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - duesoon-internal

volumes:
  duesoon-db-data:

networks:
  duesoon-internal:
    driver: bridge
